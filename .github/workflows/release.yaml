name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  check-semver:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      release-version: ${{ steps.bump_version.outputs.release_version }}
      release: ${{ steps.bump_version.outputs.release }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: bump_version
        run: |
          version=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' src/aircheckdata/__init__.py)
          if [ -z "$version" ]; then
            echo "Could not read __version__ from src/aircheckdata/__init__.py" >&2
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; bump __version__ to release."
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "Releasing $tag"
            echo "release=true" >> $GITHUB_OUTPUT
          fi
          echo "release_version=$tag" >> $GITHUB_OUTPUT

  release:
    needs: [test, check-semver]
    if: needs.check-semver.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.check-semver.outputs.release-version }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --frozen --all-groups --python 3.12

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog_config.json"

      - name: Create and push git tag
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          git tag -a "${RELEASE_VERSION}" -m "Release version ${RELEASE_VERSION}"
          git push origin "${RELEASE_VERSION}"

      - name: Build the wheel and sdist
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          body: ${{ steps.github_release.outputs.changelog }}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aircheckdata"
dynamic = ["version"]
description = "Load AIRCHECK DNA-encoded library (DEL) datasets into pandas DataFrames."
authors = [
    { name = "Nabin Bagale", email = "bhklab.nabinbagale@gmail.com" },
]
readme = "README package.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pandas>=1.3.0",
    "pyarrow>=5.0.0",
    "tqdm>=4.62.0",
    "requests>=2.25.0",
    "PyYAML>=5.4.0",
    "click>=8.0.0",
]

[project.urls]
Website = "https://www.aircheck.ai/"
"Source Code" = "https://github.com/StructuralGenomicsConsortium/AIRCHECK-data-package"
"Bug Tracker" = "https://github.com/StructuralGenomicsConsortium/AIRCHECK-data-package/issues"
Documentation = "https://github.com/StructuralGenomicsConsortium/AIRCHECK-data-package"

[project.scripts]
aircheckdata = "aircheckdata.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-xdist",
    "pytest-cov",
    "ruff",
    "ipywidgets",
    "jupyterlab",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aircheckdata = ["configs/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "aircheckdata.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "PT",   # pytest style
    "C4",   # comprehensions
    "PD",   # pandas-vet
    "F",    # pyflakes
    "W605", # invalid escape sequence
    "I",    # isort
]
ignore = [
    "PD901", # allow short DataFrame names like df
    "D212",  # summary may start on the second line
    "D213",  # summary may start on the first line
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
